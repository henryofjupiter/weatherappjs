<!DOCTYPE html>
<html lang="">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="changer">

<div class="card" id="gradient2">
    <div class="search">
        <input type="text" placeholder="Enter City Name" spellcheck="false">
        <button><img src="images/search.png" alt=""></button>
    </div>

    <div class="homepage" id="homepage2">
        <img src="images/arrow.png" alt="">
        <h1>Search city</h1>
        <h2>town or province</h2>
    </div>
    <div class="weather">
        <img src="images/rain.png" alt="" class="weather-icon">
        <h1 class="temp">22&deg</h1>
        <h2 class="city">Wisconsin</h2>
        <div class="weather-conditions">
            <div>
                <p class="conditions">place-holder</p>
            </div>
            <div>
                <p class="willrain">place-holder </p>
            </div>
        </div>
        <div class="details">
            <div class="col">
                <img src="images/mist.png">
                <div>
                    <p class="humidity">20%</p>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="col">
                <img src="images/windy.png">
                <div>
                    <p class="wind">20 KPH</p>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>

    </div>

</div>
<script src="script.js"></script>
</body>
</html>
